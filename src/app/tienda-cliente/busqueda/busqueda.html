<section class="pagina-seccion">
  <div class="contenedor">
    <p class="eyebrow">Explora</p>
    <h1>Búsqueda de productos</h1>
    <p class="descripcion">Encuentra accesorios, componentes y consolas disponibles en la tienda.</p>

    <div class="grid-productos">
      @for (producto of productos; track producto.id) {
      <article class="card-producto">
        <div class="icono">{{ producto.icono }}</div>
        <h3>{{ producto.nombre }}</h3>
        <p class="categoria">
          {{ obtenerNombreSubcategoria(producto.subcategoriaId) }}
        </p>
        <p class="precio">S/ {{ producto.precio.toFixed(2) }}</p>
      </article>
      }
    </div>
  </div>
</section>
